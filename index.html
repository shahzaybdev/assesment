<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Portal — Login</title>
  <meta name="description" content="Login to the Career Portal psychometric assessment system.">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Google Identity Services (for Google Sign-In) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <div class="login-page">
    <div class="login-box">
      <h1>🏢 Career Portal</h1>
      <p class="sub">Psychometric Assessment System</p>

      <div class="login-tabs">
        <div class="login-tab active" id="tab-admin" onclick="switchTab('admin')">HR Admin</div>
        <div class="login-tab" id="tab-candidate" onclick="switchTab('candidate')">Candidate</div>
      </div>

      <!-- ── Admin Panel ── -->
      <div class="login-panel active" id="panel-admin">
        <div id="admin-msg"></div>
        <div class="form-group">
          <label for="admin-email">Email</label>
          <input type="email" id="admin-email" placeholder="admin@company.com" value="admin@company.com">
        </div>
        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" placeholder="••••••••" value="Admin@123">
        </div>
        <button class="btn btn-primary w-full" onclick="adminLogin()">Login as HR Admin</button>
        <p class="text-muted mt-8 text-center">Default: admin@company.com / Admin@123</p>
      </div>

      <!-- ── Candidate Panel ── -->
      <div class="login-panel" id="panel-candidate">
        <!-- Sub-tabs: Login / Register -->
        <div style="display:flex;gap:0;margin-bottom:16px;border:1px solid #e5e7eb;border-radius:5px;overflow:hidden;">
          <button class="btn btn-primary" id="ctab-login" style="flex:1;border-radius:0;border:none;"
            onclick="switchCandidateTab('login')">Login</button>
          <button class="btn btn-outline" id="ctab-register" style="flex:1;border-radius:0;border:none;"
            onclick="switchCandidateTab('register')">Register</button>
        </div>

        <div id="candidate-msg"></div>

        <!-- Login Form -->
        <div id="c-login-form">
          <div class="form-group">
            <label for="c-email">Email</label>
            <input type="email" id="c-email" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="c-password">Password</label>
            <input type="password" id="c-password" placeholder="••••••••">
          </div>
          <button class="btn btn-primary w-full" onclick="candidateLogin()">Login</button>

          <div class="divider"><span>or</span></div>
          <div id="google-btn-container">
            <button class="btn btn-google" id="google-fallback-btn" onclick="googleSignInFallback()">
              <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335"
                  d="M24 9.5c3.5 0 6.6 1.3 9 3.4l6.7-6.7C35.7 2.4 30.2 0 24 0 14.7 0 6.7 5.6 2.8 13.7l7.8 6.1C12.5 13.1 17.8 9.5 24 9.5z" />
                <path fill="#4285F4"
                  d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v8.7h12.4c-.5 2.9-2.2 5.4-4.7 7l7.3 5.7c4.3-4 6.8-9.9 6.8-16.8z" />
                <path fill="#FBBC05"
                  d="M10.6 28.6A14.9 14.9 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6l-7.8-6.1A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.7l8.1-6.1z" />
                <path fill="#34A853"
                  d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.3-5.7c-2 1.4-4.6 2.2-7.9 2.2-6.2 0-11.5-3.6-13.4-9.4l-8.1 6.1C6.7 42.4 14.7 48 24 48z" />
              </svg>
              Sign in with Google
            </button>
          </div>
          <p class="text-muted mt-8 text-center" id="google-setup-note" style="display:none;">
            Google Sign-In requires setup. See README.md.
          </p>
        </div>

        <!-- Register Form -->
        <div id="c-register-form" style="display:none;">
          <div class="form-group">
            <label for="r-name">Full Name</label>
            <input type="text" id="r-name" placeholder="Your full name">
          </div>
          <div class="form-group">
            <label for="r-email">Email</label>
            <input type="email" id="r-email" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="r-password">Password</label>
            <input type="password" id="r-password" placeholder="Min. 6 characters">
          </div>
          <button class="btn btn-success w-full" onclick="candidateRegister()">Create Account</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Scripts ─────────────────────────────────────────────────────────────── -->
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/seed.js"></script>

  <script>
    // Run seed on load
    seedDatabase();

    // ── Google Identity Services setup ────────────────────────────────────────
    function initGoogleSignIn() {
      if (!Config.GOOGLE_CLIENT_ID) {
        // No client ID configured — show note, hide GIS button
        document.getElementById('google-fallback-btn').style.display = 'none';
        document.getElementById('google-setup-note').style.display = 'block';
        return;
      }
      // Render GIS button
      const container = document.getElementById('google-btn-container');
      container.innerHTML = ''; // clear fallback
      google.accounts.id.initialize({
        client_id: Config.GOOGLE_CLIENT_ID,
        callback: function (response) {
          const result = Auth.handleGoogleCredential(response.credential);
          if (result.success) {
            window.location.href = 'candidate.html';
          } else {
            Utils.showMsg('candidate-msg', result.error, 'error');
          }
        }
      });
      google.accounts.id.renderButton(container, { theme: 'outline', size: 'large', width: 340 });
    }

    // Called if Google GIS library not loaded or no client ID
    function googleSignInFallback() {
      if (!Config.GOOGLE_CLIENT_ID) {
        Utils.showMsg('candidate-msg', 'Google Sign-In is not configured. Please set GOOGLE_CLIENT_ID in js/config.js. See README.md for instructions.', 'error');
        return;
      }
    }

    // Wait for GIS library to load
    window.addEventListener('load', () => {
      if (typeof google !== 'undefined') initGoogleSignIn();
      else {
        // GIS script not loaded (offline/no client ID)
        if (!Config.GOOGLE_CLIENT_ID) {
          document.getElementById('google-fallback-btn').style.display = 'none';
          document.getElementById('google-setup-note').style.display = 'block';
        }
      }
    });

    // ── Tab switching ──────────────────────────────────────────────────────────
    function switchTab(tab) {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.login-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
    }

    function switchCandidateTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('c-login-form').style.display = isLogin ? '' : 'none';
      document.getElementById('c-register-form').style.display = isLogin ? 'none' : '';
      document.getElementById('ctab-login').className = isLogin ? 'btn btn-primary' : 'btn btn-outline';
      document.getElementById('ctab-register').className = isLogin ? 'btn btn-outline' : 'btn btn-primary';
      document.getElementById('ctab-login').style.cssText = 'flex:1;border-radius:0;border:none;';
      document.getElementById('ctab-register').style.cssText = 'flex:1;border-radius:0;border:none;';
      Utils.clearMsg('candidate-msg');
    }

    // ── Login handlers ─────────────────────────────────────────────────────────
    // ── Login handlers ─────────────────────────────────────────────────────────
    async function adminLogin() {
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;

      const result = await Auth.login(email, password);

      if (result.success) {
        window.location.href = 'admin.html';
      } else {
        Utils.showMsg('admin-msg', result.error, 'error');
      }
    }

    async function candidateLogin() {
      const email = document.getElementById('c-email').value.trim();
      const password = document.getElementById('c-password').value;

      const result = await Auth.login(email, password);

      if (result.success) {
        window.location.href = 'candidate.html';
      } else {
        Utils.showMsg('candidate-msg', result.error, 'error');
      }
    }

    function candidateRegister() {
      const name = document.getElementById('r-name').value.trim();
      const email = document.getElementById('r-email').value.trim();
      const password = document.getElementById('r-password').value;

      const result = Auth.register(name, email, password);

      if (result.success) {
        Utils.showMsg(
          'candidate-msg',
          'Account created! Please login.',
          'success'
        );

        switchCandidateTab('login');
        document.getElementById('c-email').value = email;
      } else {
        Utils.showMsg('candidate-msg', result.error, 'error');
      }
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const activePanel = document.querySelector('.login-panel.active');
        if (activePanel.id === 'panel-admin') adminLogin();
        else if (document.getElementById('c-register-form').style.display !== 'none') candidateRegister();
        else candidateLogin();
      }
    });

    // Redirect if already logged in
    const user = Auth.getCurrentUser();
    if (user) window.location.href = user.role === 'admin' ? 'admin.html' : 'candidate.html';
  </script>
</body>

</html>
