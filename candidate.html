<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PBL Portal — My Portal</title>
  <meta name="description" content="Candidate portal for completing psychometric assessments.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="candidate-header">
    <div class="flex" style="align-items:center;gap:16px;">
      <span class="candidate-logo">
        <img src="pbl-logo.png" alt="PBL Portal Logo" class="logo-img">
      </span>
      <span style="font-weight:700;color:var(--text-primary);">PBL Portal</span>
      <nav class="c-nav">
        <a href="#/portal"  data-page="portal">My Assessments</a>
        <a href="#/profile" data-page="profile">My Profile</a>
      </nav>
    </div>
    <div class="flex" style="align-items:center;gap:12px;">
      <span id="c-user-name" style="font-size:13px;color:var(--text-secondary);font-weight:500;"></span>
      <button class="btn btn-outline btn-sm" onclick="Auth.logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </header>

  <!-- Content -->
  <div class="candidate-body">
    <div id="c-content">
      <div class="flex-center loading-state">Loading…</div>
    </div>
  </div>

<!-- Foundation scripts -->
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/seed.js"></script>

<!-- Candidate page scripts -->
<script src="js/candidate/portal.js"></script>
<script src="js/candidate/take-assessment.js"></script>
<script src="js/candidate/profile.js"></script>

<!-- App router (must be last) -->
<script src="js/candidate/app.js"></script>

</body>
</html>
