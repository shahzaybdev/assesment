<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portal — Career Portal</title>
  <meta name="description" content="Candidate portal for completing psychometric assessments.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body style="background:#f3f4f6;min-height:100vh;">

  <!-- Header -->
  <header class="candidate-header">
    <div style="display:flex;align-items:center;gap:16px;">
      <span style="font-weight:700;color:#111827;">🏢 Career Portal</span>
      <nav class="c-nav" style="display:flex;gap:0;">
        <a href="#/portal"  data-page="portal"  style="padding:6px 14px;border-radius:4px;text-decoration:none;font-size:13px;color:#374151;font-weight:500;">My Assessments</a>
        <a href="#/profile" data-page="profile" style="padding:6px 14px;border-radius:4px;text-decoration:none;font-size:13px;color:#374151;font-weight:500;">My Profile</a>
      </nav>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="c-user-name" style="font-size:13px;color:#374151;font-weight:500;"></span>
      <button class="btn btn-outline btn-sm" onclick="Auth.logout()">Logout</button>
    </div>
  </header>

  <!-- Content -->
  <div class="candidate-body">
    <div id="c-content">
      <div class="flex-center" style="height:60vh;color:#9ca3af;">Loading…</div>
    </div>
  </div>

<!-- Foundation scripts -->
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/seed.js"></script>

<!-- Candidate page scripts -->
<script src="js/candidate/portal.js"></script>
<script src="js/candidate/take-assessment.js"></script>
<script src="js/candidate/profile.js"></script>

<!-- App router (must be last) -->
<script src="js/candidate/app.js"></script>

<style>
  /* Active nav highlight for candidate header */
  .c-nav a.active { background: #eff6ff; color: #2563eb; }
  .c-nav a:hover  { background: #f3f4f6; }
</style>
</body>
</html>
